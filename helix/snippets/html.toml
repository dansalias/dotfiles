# ln ~/.config/helix/snippets/html.toml

[[snippets]]
prefix = "!html"
body = '''
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>${1:Site Title}</title>
  </head>
  <body>
    $0
  </body>
</html>'''
description = "html doc"
