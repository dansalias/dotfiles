# ln ~/.config/helix/themes/custom.toml

# ui
"ui.cursor" = { fg = "black", bg = "white" }
"ui.linenr" = "gray"
"ui.linenr.selected" = "white"
"ui.selection" = { fg = "white", bg = "gray" }
"ui.statusline" = { bg = "white", fg = "black" }

"diagnostic" = { underline = { color = "blue", style = "curl" } }
"diagnostic.warning" = { underline = { color = "yellow", style = "curl" } }
"diagnostic.error" = { underline = { color = "red", style = "curl" } }

"diff.delta" = "yellow"
"diff.plus" = "green"
"diff.minus" = "red"

"warning" = "yellow"
"error" = "red"
"info" = "light-blue"
"hint" = "light-green"

# syntax
"attribute" = "light-yellow"
"type" = "light-yellow"
"constructor" = "light-yellow"
"constant" = "blue"
"string" = "green"
"comment" = { fg = "gray", modifiers = ["italic"] }
"variable" = "cyan"
"variable.builtin" = "magenta"
"variable.other.member" = "light-cyan"
"label" = "magenta"
"punctuation" = "light-cyan"
"keyword" = "magenta"
"function" = "light-blue"
"tag" = "cyan"
"namespace" = "magenta"
"special" = "magenta"

[palette]
black = "#000000"
white = "#ffffff"
gray = "#6e6e6e"

green="#1cd929"
