<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5120 2160">
  <style>
    line {
      stroke-width: 5;
      stroke: black;
    }

    .arcs {
      stroke-width: 3;
      stroke: black;
      fill: none;
      opacity: 0.3;
    }

    text {
      font-family: 'Hack', monospace;
      font-size: 28pt;
      letter-spacing: 0.1em;
    }

    .soft {
      opacity: 0.7;
    }

    .bright-60 {
      filter: brightness(60%);
    }

    .bright-10 {
      filter: brightness(34%);
    }
  </style>
  <defs>
    <filter id="dilate">
      <feMorphology operator="dilate" radius="30"/>
    </filter>
    <rect x="0" y="0" width="100%" height="100%" id="rect-full"/>
    <linearGradient id="gradient">
      <stop offset="0%" stop-color="#9c3939"/>
      <stop offset="20%" stop-color="#747d6f"/>
      <stop offset="40%" stop-color="#ad9254"/>
      <stop offset="60%" stop-color="#7f79b2"/>
      <stop offset="80%" stop-color="#a176b7"/>
      <stop offset="100%" stop-color="#5d8b90"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <mask id="fade-mask" maskUnits="objectBoundingBox" maskContentUnits="objectBoundingBox">
      <rect x="0" y="0" width="1" height="1" fill="url(#fade)"/>
    </mask>
    <pattern id="dots" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <circle cx="25" cy="25" r="6" fill="#000000"/>
    </pattern>
    <pattern id="lines" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect x="0" y="24" width="50" height="2" fill="#000000"/>
    </pattern>
    <pattern id="squares" x="0" y="0" width="0.04" height="0.04">
      <rect x="10" y="10" width="30" height="30"/>
    </pattern>

    <path
      id="kernel-path"
      d="M 300,1600 a 2000 2000 0 0 0 2000,-2000"
    />
    <text id="kernel-text">
      <textPath alignment-baseline="middle" text-anchor="middle" href="#kernel-path" startOffset="1000">
        ${kernel-version}
      </textPath>
    </text>

    <path
      id="distro-path"
      d="M 600,3600 a 2000 2000 0 0 1 4000,0"
    />
    <text id="distro-text">
      <textPath alignment-baseline="middle" text-anchor="middle" href="#distro-path" startOffset="2900">
        ${nixos-version}
      </textPath>
    </text>

    <path
      id="wm-path"
      d="M 2600,-1000 a 2000 2000 0 0 0 2000,2000"
    />
    <text id="wm-text">
      <textPath alignment-baseline="middle" text-anchor="middle" href="#wm-path" startOffset="1800">
        ${niri-version}
      </textPath>
    </text>

    <mask id="text-mask">
      <use href="#rect-full" fill="#ffffff"/>
      <g filter="url(#dilate)">
        <use href="#kernel-text"/>
        <use href="#distro-text"/>
        <use href="#wm-text"/>
      </g>
    </mask>

    <mask id="mask">
      <use href="#rect-full" fill="#ffffff"/>

      <rect x="-1500" y="1000" width="2000" height="400" fill="url(#dots)" transform="rotate(-45)"/>
      <rect x="600" y="-1600" width="2000" height="600" fill="url(#lines)" transform="rotate(45)"/>
      <rect x="3800" y="-3500" width="3000" height="3000" fill="url(#squares)" transform="rotate(45)" class="soft" mask="url(#fade-mask)"/>

      <g class="arcs" mask="url(#text-mask)">
        <circle cx="300" cy="-400" r="2000"/>
        <circle cx="2600" cy="3600" r="2000"/>
        <circle cx="4600" cy="-1000" r="2000"/>
      </g>

      <g opacity="0.6">
        <use href="#kernel-text"/>
        <use href="#distro-text"/>
        <use href="#wm-text"/>
      </g>

    </mask>
  </defs>
  <use class="bright-60" href="#rect-full" fill="url(#gradient)"/>
  <use class="bright-10" href="#rect-full" fill="#151a24" mask="url(#mask)"/>
</svg>
