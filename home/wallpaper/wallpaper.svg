<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5120 2160">
  <style>
    line {
      stroke-width: 5;
      stroke: black;
    }

    .arcs {
      stroke-width: 3;
      stroke: black;
      fill: none;
      opacity: 0.3;
    }

    text {
      font-family: 'Hack', monospace;
      font-size: 28pt;
      letter-spacing: 0.1em;
      text-anchor: middle;
    }

    textPath {
      alignment-baseline: middle;
    }

    .opacity-60 {
      opacity: 0.6;
    }

    .opacity-70 {
      opacity: 0.7;
    }

    .bright-50 {
      filter: brightness(50%);
    }

    .bright-30 {
      filter: brightness(30%);
    }
  </style>
  <defs>
    <rect x="0" y="0" width="100%" height="100%" id="rect-full"/>

    <linearGradient id="gradient">
      <stop offset="0%" stop-color="#9c3939"/>
      <stop offset="20%" stop-color="#747d6f"/>
      <stop offset="40%" stop-color="#ad9254"/>
      <stop offset="60%" stop-color="#7f79b2"/>
      <stop offset="80%" stop-color="#a176b7"/>
      <stop offset="100%" stop-color="#5d8b90"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>

    <mask id="fade-mask" maskUnits="objectBoundingBox" maskContentUnits="objectBoundingBox">
      <rect x="0" y="0" width="1" height="1" fill="url(#fade)"/>
    </mask>
    <pattern id="dots" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <circle cx="25" cy="25" r="6" fill="#000000"/>
    </pattern>
    <pattern id="lines" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect x="0" y="24" width="50" height="2" fill="#000000"/>
    </pattern>
    <pattern id="squares" x="0" y="0" width="0.04" height="0.04">
      <rect x="10" y="10" width="30" height="30"/>
    </pattern>

    <!-- cx = 300  cy = -400  r = 2000 -->
    <path id="kernel-path" d="M -1700,-400 a 2000 2000 0 0 0 4000,0"/>

    <!-- cx = 2600 cy = 3600  r = 2000 -->
    <path id="distro-path" d="M 600,3600 a 2000 2000 0 0 1 4000,0"/>

    <!-- cx = 4600 cy = -1000 r = 2000 -->
    <path id="wm-path" d="M 2600,-1000 a 2000 2000 0 0 0 2000,2000"/>

    <mask id="text-mask">
      <use href="#rect-full" fill="#ffffff"/>
      <text stroke="black" stroke-width="60">
        <textPath href="#kernel-path" startOffset="4200">
          ${masks[kernel]}
        </textPath>
        <textPath href="#distro-path" startOffset="2900">
          ${masks[distro]}
        </textPath>
        <textPath href="#wm-path" startOffset="1800">
          ${masks[wm]}
        </textPath>
      </text>
    </mask>

    <mask id="mask">
      <use href="#rect-full" fill="#ffffff"/>

      <rect x="-1500" y="1000" width="2000" height="400" fill="url(#dots)" transform="rotate(-45)"/>
      <rect x="600" y="-1600" width="2000" height="600" fill="url(#lines)" transform="rotate(45)"/>
      <rect x="3800" y="-3500" width="3000" height="3000" fill="url(#squares)" transform="rotate(45)" class="opacity-70" mask="url(#fade-mask)"/>

      <g class="arcs" mask="url(#text-mask)">
        <use href="#kernel-path"/>
        <use href="#distro-path"/>
        <use href="#wm-path"/>
      </g>

      <g class="opacity-60">
        <text>
          <textPath href="#kernel-path" startOffset="4200">
            ${versions[kernel]}
          </textPath>
          <textPath alignment-baseline="middle" href="#distro-path" startOffset="2900">
            ${versions[distro]}
          </textPath>
          <textPath alignment-baseline="middle" href="#wm-path" startOffset="1800">
            ${versions[wm]}
          </textPath>
        </text>
      </g>

    </mask>
  </defs>
  <use class="bright-50" href="#rect-full" fill="url(#gradient)"/>
  <use class="bright-30" href="#rect-full" fill="#151a24" mask="url(#mask)"/>
</svg>
